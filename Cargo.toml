[package]
name = "babycrab"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dotenvy = "0.15.7"
octocrab = "0.54.6"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "migrate",
    "postgres",
    "chrono"
] }
